{% extends "base.html" %}
{% block title %}Log in — CareerHub{% endblock %}

{% block content %}
<div class="auth-screen">
    <div class="auth-card">
        <p class="eyebrow">Stage 01 — Sign in</p>
        <h1>Welcome back</h1>
        <p class="auth-card__subtitle">Pick up your search where you left it.</p>

        <form method="POST" class="form">
            <label class="field">
                <span class="field__label">Username or email</span>
                <input type="text" name="identifier" required autofocus placeholder="jane_doe">
            </label>
            <label class="field">
                <span class="field__label">Password</span>
                <input type="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </label>
            <button type="submit" class="btn btn--primary btn--block">Log in</button>
        </form>

        <p class="auth-card__footer">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
